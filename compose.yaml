services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: anki
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: anki
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anki"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://anki:local-development-only@db:5432/anki
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or a root .env file}
      ROCKET_SECRET_KEY: ${ROCKET_SECRET_KEY:?Set ROCKET_SECRET_KEY to a random 32-byte base64 value}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
